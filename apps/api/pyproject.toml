[project]
name = "fraudfish-api"
version = "0.1.0"
description = "FraudFish investigation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
