services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraudfish
      POSTGRES_USER: fraudfish
      POSTGRES_PASSWORD: fraudfish
    ports:
      - "5432:5432"
    volumes:
      - fraudfish_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudfish -d fraudfish"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-now
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - fraudfish_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - fraudfish_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fraudfish_postgres:
  fraudfish_neo4j:
  fraudfish_redis:
